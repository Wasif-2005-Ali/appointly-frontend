name: appointly
description: Appointment Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.2+hotfix.4
  web_socket_channel: ^2.4.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  sqflite: ^2.3.0
  path: ^1.9.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  record: ^5.1.0
  path_drawing: ^1.0.1
  image: ^4.2.0
  crypto: ^3.0.3
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  file_saver: ^0.2.14
  share_plus: ^10.0.0
  http: ^1.2.0
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  # DM Sans is bundled so the app never has to download fonts at
  # runtime (google_fonts picks up the bundled family automatically).
  # Keep the family name "DM Sans" — it must match GoogleFonts.dmSans.
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm-sans-v17-latin-regular.ttf
          weight: 400
        - asset: assets/fonts/dm-sans-v17-latin-500.ttf
          weight: 500
        - asset: assets/fonts/dm-sans-v17-latin-600.ttf
          weight: 600
        - asset: assets/fonts/dm-sans-v17-latin-700.ttf
          weight: 700