name: appointly
description: Appointment Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  sqflite: ^2.3.0
  path: ^1.9.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  path_drawing: ^1.0.1
  image: ^4.2.0
  crypto: ^3.0.3
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  file_saver: ^0.2.14
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/