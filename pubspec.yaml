name: appointly
description: Appointment Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.2+hotfix.4
  web_socket_channel: ^2.4.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  sqflite: ^2.3.0
  path: ^1.9.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  record: ^6.0.0
  audioplayers: ^6.4.0
  path_drawing: ^1.0.1
  image: ^4.2.0
  crypto: ^3.0.3
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  file_saver: ^0.2.14
  share_plus: ^10.0.0
  http: ^1.2.0
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  # Fonts are bundled so the app never downloads them at runtime
  # (GoogleFonts.config.allowRuntimeFetching is false — see main.dart).
  # google_fonts finds a bundled file ONLY when the asset path
  # (minus extension) case-sensitively ends with the Google Fonts API
  # filename, i.e. "<Family>-<WeightName>" — e.g. "DM Sans-Regular",
  # "DM Sans-ExtraBold", "Space Grotesk-Bold". Do NOT rename these
  # files to anything else, or the font silently falls back.
  # Weights bundled here cover every GoogleFonts.* use in the app:
  # DM Sans 400-900 + italics (400/500), Poppins 400-700,
  # Space Grotesk 400-700 (its w800 uses closest-match to Bold).
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DM Sans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DM Sans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DM Sans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DM Sans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DM Sans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/DM Sans-Black.ttf
          weight: 900
        - asset: assets/fonts/DM Sans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/DM Sans-MediumItalic.ttf
          weight: 500
          style: italic
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/Space Grotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/Space Grotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/Space Grotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Space Grotesk-Bold.ttf
          weight: 700